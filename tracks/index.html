<style>
html body{background:#060708!important}
#bgv{position:fixed;inset:0;z-index:0;pointer-events:none;background:
 radial-gradient(80% 50% at 50% -10%,color-mix(in srgb,var(--acc,#FF0074) 28%,transparent),transparent 70%),
 radial-gradient(60% 40% at 110% 70%,rgba(0,210,91,.10),transparent 70%),
 repeating-linear-gradient(135deg,rgba(255,255,255,.018) 0 2px,transparent 2px 9px),#060708;transition:background .6s}
#scroller{position:relative;z-index:1}
.intro{color:#b9bbc3;font-size:15px;margin:-4px 0 16px;line-height:1.45}
.grid{display:grid;gap:14px}
.tc{position:relative;display:flex;align-items:center;gap:14px;padding:14px;border-radius:22px;text-decoration:none;color:#fff;overflow:hidden;
 background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.01) 50%),rgba(14,15,18,.85);border:1px solid rgba(255,255,255,.1);box-shadow:0 16px 34px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12)}
.tc:before{content:"";position:absolute;inset:0;background:radial-gradient(70% 90% at 0% 50%,color-mix(in srgb,var(--a) 22%,transparent),transparent 70%);pointer-events:none}
.tc:active{transform:scale(.985)}
.tc svg{position:relative;flex:none;width:118px;height:104px}
.tc .t{position:relative;flex:1;min-width:0}
.tc small{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--a)}
.tc b{display:block;font-family:var(--display);font-size:21px;line-height:1.05;margin:3px 0 5px}
.tc span{display:block;color:#a9abb3;font-size:13px}
.tc i{position:relative;font-style:normal;color:#8d9099;font-size:24px}
.soon{border:1px dashed rgba(255,255,255,.18);border-radius:18px;padding:14px;color:#9a9ca4;font-size:14px;text-align:center;margin-top:14px}
/* detail */
.hero{position:relative;border-radius:26px;overflow:hidden;margin:0 0 14px;border:1px solid rgba(255,255,255,.1);
 background:radial-gradient(90% 70% at 50% 40%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 70%),linear-gradient(180deg,#121317,#0a0b0d);box-shadow:0 20px 44px rgba(0,0,0,.55)}
.hero .map{display:block;width:100%;height:auto;max-height:52vh;padding:18px 18px 6px}
.hero .cap{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:0 18px 16px}
.hero .cap small{display:block;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.hero .cap h2{font-family:var(--display);font-size:clamp(28px,8.5vw,40px);line-height:.95;margin:4px 0 0}
.hero .cap p{margin:5px 0 0;color:#a9abb3;font-size:13.5px}
.chq{height:8px;background:conic-gradient(#fff 25%,#111 0 50%,#fff 0 75%,#111 0) 0 0/8px 8px;opacity:.85}
.track-main{fill:none;stroke:var(--acc);stroke-width:13;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 14px color-mix(in srgb,var(--acc) 70%,transparent))}
.track-core{fill:none;stroke:#fff;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round;opacity:.9}
.track-alt{fill:none;stroke:rgba(255,255,255,.16);stroke-width:7;stroke-linecap:round;stroke-dasharray:2 14}
.draw{stroke-dasharray:var(--L);stroke-dashoffset:var(--L);animation:draw 2.2s cubic-bezier(.6,.1,.2,1) .15s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
.stat{border-radius:16px;padding:12px 10px;text-align:center;background:rgba(18,19,23,.85);border:1px solid rgba(255,255,255,.08)}
.stat b{display:block;font-family:var(--display);font-size:18px;line-height:1.1;white-space:nowrap}.stat span{display:block;color:#8d9099;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.brad{position:relative;display:flex;gap:14px;align-items:center;border-radius:22px;padding:16px;margin:0 0 14px;overflow:hidden;
 background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 26%,#141519),#101114 70%);border:1px solid color-mix(in srgb,var(--acc) 45%,transparent)}
.brad:before{content:"\201C";position:absolute;right:10px;top:-34px;font-family:Georgia,serif;font-size:170px;line-height:1;color:rgba(255,255,255,.07)}
.brad img{flex:none;width:76px;height:76px;border-radius:50%;object-fit:cover;background:#1b1c21;border:3px solid var(--acc);box-shadow:0 8px 20px rgba(0,0,0,.45)}
.brad blockquote{position:relative;margin:0;font-family:var(--display);font-size:17px;line-height:1.25}
.brad cite{display:block;margin-top:8px;font-style:normal;color:#d7d8de;font-size:12.5px;font-weight:700;letter-spacing:.04em}
.brad .draft{display:inline-block;margin-left:6px;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#111;background:#F5C542;border-radius:6px;padding:2px 6px}
h3.sec{font-family:var(--display);font-size:19px;margin:18px 2px 10px}
.vid{position:relative;border-radius:20px;overflow:hidden;background:#000;border:1px solid rgba(255,255,255,.1);margin:0 auto 6px;box-shadow:0 16px 34px rgba(0,0,0,.5)}
.vid.h{aspect-ratio:16/9}.vid.v{aspect-ratio:9/16;max-width:340px}
.vid button{position:absolute;inset:0;border:0;padding:0;cursor:pointer;background:#000 center/cover no-repeat}
.vid button:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 50%,rgba(0,0,0,.65))}
.vid .play{position:absolute;left:50%;top:50%;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 8px color-mix(in srgb,var(--acc) 30%,transparent),0 10px 24px rgba(0,0,0,.5);z-index:1}
.vid .play:before{content:"";position:absolute;left:29px;top:22px;border-left:24px solid #fff;border-top:15px solid transparent;border-bottom:15px solid transparent}
.vid .vt{position:absolute;left:14px;right:14px;bottom:12px;z-index:1;color:#fff;font-weight:800;font-size:14px;text-align:left;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 0 4px;overscroll-behavior-x:contain}
.car::-webkit-scrollbar{display:none}
.sl{position:relative;flex:0 0 88%;scroll-snap-align:center;height:min(62vh,520px);border-radius:20px;overflow:hidden;background:#000;border:1px solid rgba(255,255,255,.1);box-shadow:0 16px 34px rgba(0,0,0,.5)}
.sl .bk{position:absolute;inset:-30px;background:center/cover no-repeat;filter:blur(26px) brightness(.45) saturate(1.3)}
.sl .fr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:14px;overflow:hidden;background:#000;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.sl.v .fr{height:calc(100% - 64px);aspect-ratio:9/16;max-width:calc(100% - 24px)}
.sl.h .fr{width:calc(100% - 20px);aspect-ratio:16/9}
.sl button{position:absolute;inset:0;border:0;padding:0;cursor:pointer;background:#000 center/cover no-repeat}
.sl iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.sl .play{position:absolute;left:50%;top:50%;width:68px;height:68px;margin:-34px 0 0 -34px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 8px color-mix(in srgb,var(--acc) 30%,transparent),0 10px 24px rgba(0,0,0,.5)}
.sl .play:before{content:"";position:absolute;left:27px;top:20px;border-left:22px solid #fff;border-top:14px solid transparent;border-bottom:14px solid transparent}
.sl .lab{position:absolute;left:14px;right:14px;bottom:12px;z-index:2;display:flex;align-items:center;gap:8px;pointer-events:none}
.sl .lab em{flex:none;font-style:normal;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:var(--acc);color:#fff;border-radius:6px;padding:4px 7px}
.sl .lab span{color:#fff;font-weight:800;font-size:13.5px;text-shadow:0 2px 8px rgba(0,0,0,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl.h .lab{bottom:14px}
.car.allh .sl{height:auto}.car.allh .sl .fr{position:relative;left:auto;top:auto;transform:none;margin:10px 10px 74px;width:auto}.car.allh .sl .lab{flex-direction:column;align-items:flex-start;gap:5px;bottom:12px}.car.allh .sl .lab span{max-width:100%}
.dots{display:flex;justify-content:center;gap:7px;margin:10px 0 2px}
.dots button{width:8px;height:8px;border-radius:99px;border:0;padding:0;background:rgba(255,255,255,.25);transition:width .25s,background .25s}
.dots button.on{width:22px;background:var(--acc)}
.swipe{color:#8d9099;font-size:12.5px;text-align:center;margin:2px 0 0}
.facts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.facts li{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:11px 13px;background:rgba(18,19,23,.85);border:1px solid rgba(255,255,255,.08);font-size:14.5px;line-height:1.35}
.facts li:before{content:"";flex:none;width:8px;height:8px;margin-top:6px;border-radius:2px;background:var(--acc);transform:rotate(45deg)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.acts a{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:14px;text-decoration:none;font-weight:800;font-size:14.5px;color:#fff;background:rgba(18,19,23,.85);border:1px solid rgba(255,255,255,.12)}
.acts a.p{background:var(--acc);border-color:var(--acc);color:#fff}
.acts a i{width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff;animation:bl 1.4s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}
.osm{color:#6f727b;font-size:11.5px;margin:6px 2px 18px}.osm a{color:#8d9099}
.nav2{display:flex;justify-content:space-between;gap:10px;margin:4px 0 16px}
.nav2 a{flex:1;text-decoration:none;color:#cfd1d6;font-weight:700;font-size:13.5px;padding:11px 12px;border-radius:12px;background:rgba(18,19,23,.75);border:1px solid rgba(255,255,255,.08)}
.nav2 a:last-child{text-align:right}
.nomap{display:flex;text-align:center;padding:8px;align-items:center;justify-content:center;color:#6f727b;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px dashed rgba(255,255,255,.14);border-radius:16px}
.tc .nomap{flex:none;width:118px;height:104px}.hero .nomap{height:220px;margin:18px}
.lays{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 0 12px;padding:2px}.lays::-webkit-scrollbar{display:none}
.lays button{flex:none;border:1px solid rgba(255,255,255,.14);background:rgba(18,19,23,.85);color:#cfd1d6;font:700 13.5px var(--body);padding:9px 14px;border-radius:99px;cursor:pointer}
.lays button.on{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 6px 18px color-mix(in srgb,var(--acc) 40%,transparent)}
.tgt h3.sec{margin-top:4px;display:flex;align-items:center;gap:8px}
.tgt .draft,.brad .draft{display:inline-block;font-family:var(--body);font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#111;background:#F5C542;border-radius:6px;padding:2px 6px}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tt{border-radius:18px;padding:14px;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.01) 60%),rgba(18,19,23,.9);border:1px solid rgba(255,255,255,.09)}
.tt small{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.tt b{display:block;font-family:var(--display);font-size:34px;line-height:1;margin:6px 0 6px;font-variant-numeric:tabular-nums}
.tt span{display:block;color:#9a9ca4;font-size:12.5px;line-height:1.3}
.tgt{margin:0 0 14px}.rec{color:#8d9099;font-size:12.5px;margin:8px 2px 0}
.acts.one{grid-template-columns:1fr}
@media (prefers-reduced-motion:reduce){.draw{animation:none;stroke-dashoffset:0}}
</style>
<script data-goatcounter="https://usemorekerb.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>

<body>
<div id="bgv"></div>
<div id="scroller"><div class="wrap">
  <header class="top"><div class="brand"><div class="r"><a class="homechip" id="back" href="../" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span id="backT">Home</span></a><img src="../team/wm.png" alt="Use More Kerb"></div><h1 id="h1">Track Guides</h1></div></header>
  <main id="app"></main>
  <a class="back" href="../">‹ Use More Kerb home</a>
</div></div>
<script>
let T=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function gc(path,title){try{window.goatcounter&&window.goatcounter.count&&window.goatcounter.count({path,title:title||path,event:true})}catch(e){}}
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))addEventListener("load",()=>navigator.serviceWorker.register("../sw.js").catch(()=>{}));
const fm=m=>m?Number(m).toLocaleString("en-GB")+"m":"TBC";
const firstDrawn=t=>Math.max(0,t.layouts.findIndex(l=>l.d));
function svg(t,li,cls,big){const l=t.layouts[li]||{};if(!t.w||!t.layouts.some(x=>x.d))return `<div class="${cls} nomap"><span>Map coming soon</span></div>`;
  const d=l.d;return `<svg class="${cls}" viewBox="-10 -10 ${t.w+20} ${t.h+20}" preserveAspectRatio="xMidYMid meet" aria-label="${esc(t.name)} ${esc(l.n||"")} layout">${big||!d?t.net.map(a=>`<path class="track-alt" d="${a}"/>`).join(""):""}${d?`<path class="track-main ${big?"draw":""}" d="${d}" style="--acc:${t.accent}${big?"":";stroke-width:26"}"/>${big?`<path class="track-core draw" d="${d}"/>`:`<path d="${d}" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round" opacity=".85"/>`}`:""}</svg>`}
function list(){document.documentElement.style.setProperty("--acc","#FF0074");$("#h1").textContent="Track Guides";$("#backT").textContent="Home";$("#back").href="../";document.title="Use More Kerb Track Guides";
  $("#app").innerHTML=`<p class="intro">The UK's best outdoor kart tracks, the way I'd brief you before your first session: every layout, a target lap time, onboard laps and the one thing to remember.</p>
  <div class="grid">${T.map(t=>{const i=firstDrawn(t),l=t.layouts[i]||{};return `<a class="tc" href="#${t.id}" style="--a:${t.accent}">${svg(t,i,"",false)}<span class="t"><small>${t.layouts.length>1?t.layouts.length+" layouts":esc(l.n||"")}</small><b>${esc(t.name)}</b><span>${esc(t.place)} · ${fm(l.m)}</span></span><i>›</i></a>`}).join("")}</div>`;}
function page(t){const i=T.indexOf(t),prev=T[(i+T.length-1)%T.length],next=T[(i+1)%T.length];let li=firstDrawn(t);
  document.documentElement.style.setProperty("--acc",t.accent);$("#h1").textContent="Track Guide";$("#backT").textContent="Tracks";$("#back").href="#";document.title=t.name+" track guide | Use More Kerb";
  const hv=t.videos.length;
  $("#app").innerHTML=`<section class="hero"><div class="chq"></div><div id="mapw"></div><div class="cap"><div><small id="lname"></small><h2>${esc(t.name)}</h2><p>${esc(t.place)}</p></div></div></section>
  ${t.layouts.length>1?`<div class="lays" id="lays" role="tablist">${t.layouts.map((l,k)=>`<button type="button" role="tab" data-l="${k}">${esc(l.n)}</button>`).join("")}</div>`:""}
  <div class="stats" id="stats"></div>
  <section class="tgt" id="tgt"></section>
  <section class="brad"><img src="brad.jpg" alt="Brad Philpot"><div><blockquote>${t.quote?esc(t.quote):"My one thing to remember at "+esc(t.name)+" is coming soon."}</blockquote><cite>Brad Philpot${t.draft?'<span class="draft">Draft</span>':""}</cite></div></section>
  ${hv?`<h3 class="sec">Onboard laps <small style="font-family:var(--body);font-size:13px;color:#8d9099;font-weight:600">${hv} videos</small></h3>
  <div class="car${t.videos.some(v=>v.v)?"":" allh"}" id="car">${t.videos.map((v,k)=>`<div class="sl ${v.v?"v":"h"}" data-k="${k}"><div class="bk" style="background-image:url(https://i.ytimg.com/vi/${esc(v.id)}/hqdefault.jpg)"></div><div class="fr"><button type="button" data-play="${k}" style="background-image:url(https://i.ytimg.com/vi/${esc(v.id)}/maxresdefault.jpg)" aria-label="Play ${esc(v.title)}"><span class="play"></span></button></div><div class="lab"><em>${esc(v.tag)}</em><span>Onboard by ${esc(v.title)}</span></div></div>`).join("")}</div>
  ${hv>1?`<div class="dots" id="dots">${t.videos.map((v,k)=>`<button type="button" data-dot="${k}" aria-label="Video ${k+1}"${k?"":' class="on"'}></button>`).join("")}</div><p class="swipe">Swipe for more onboards</p>`:""}`:`<div class="soon">Onboard laps for ${esc(t.name)} are on the way.</div>`}
  <div class="acts${hv?"":" one"}"><a class="p" href="${esc(t.live)}" ${/^https?:/.test(t.live)?'target="_blank" rel="noopener"':""} data-ev="live"><i></i>Live timing</a>${hv?`<a id="ytl" href="https://www.youtube.com/watch?v=${esc(t.videos[0].id)}" target="_blank" rel="noopener" data-ev="yt">Watch on YouTube</a>`:""}</div>
  <h3 class="sec">Need to know</h3><ul class="facts">${t.facts.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>
  <p class="osm">Track layout © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors. Dotted lines are track used by other layouts.</p>
  <div class="nav2"><a href="#${prev.id}">‹ ${esc(prev.name)}</a><a href="#${next.id}">${esc(next.name)} ›</a></div>`;
  const show=(k,anim)=>{li=k;const l=t.layouts[k]||{};$("#mapw").innerHTML=svg(t,k,"map",true);$("#lname").textContent=(l.n||"")+(t.layouts.length>1?" layout":"");
    $$("#lays button").forEach(b=>b.classList.toggle("on",+b.dataset.l===k));
    $("#stats").innerHTML=`<div class="stat"><b>${fm(l.m)}</b><span>Length</span></div><div class="stat"><b>${l.c||"TBC"}</b><span>Corners</span></div><div class="stat"><b>${t.layouts.length}</b><span>Layout${t.layouts.length>1?"s":""}</span></div>`;
    const tt=(lab,val,txt,none)=>`<div class="tt"><small>${lab}</small><b>${val?esc(val):none?"–":"TBC"}</b><span>${val?txt:none?none:"Target coming soon"}</span></div>`;
    $("#tgt").innerHTML=`<h3 class="sec">Target lap times${l.chk||t.draft?'<span class="draft">Draft</span>':""}</h3><div class="tg">
      ${tt("Rental kart",l.rent?l.ren:null,"A quick lap in the adult arrive and drive kart",l.rent?"":"No public arrive and drive")}
      ${tt("Owner driver",l.own,"A competitive club lap in a senior two-stroke","")}</div>
      ${l.rec?`<p class="rec">Lap record ${esc(l.rec)}${l.recn?" ("+esc(l.recn)+")":""}</p>`:""}${l.d?"":`<p class="rec">Map of this layout coming soon.</p>`}`;
    if(anim!==false)$$(".draw").forEach(p=>{const L=Math.ceil(p.getTotalLength());p.style.setProperty("--L",L)});else $$(".draw").forEach(p=>p.classList.remove("draw"));};
  show(li);
  $$("#lays button").forEach(b=>b.onclick=()=>{show(+b.dataset.l);b.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});gc("tracks-layout-"+t.id+"-"+b.dataset.l,"Track guide: layout "+t.name+" / "+t.layouts[+b.dataset.l].n)});
  if(hv){const car=$("#car"),step=()=>(car.querySelector(".sl")||car).offsetWidth+12,dots=[...document.querySelectorAll("#dots button")];let cur=0;
  const stopAll=()=>car.querySelectorAll("iframe").forEach(f=>{const k=+f.closest(".sl").dataset.k,v=t.videos[k];f.outerHTML=`<button type="button" data-play="${k}" style="background-image:url(https://i.ytimg.com/vi/${esc(v.id)}/maxresdefault.jpg)" aria-label="Play ${esc(v.title)}"><span class="play"></span></button>`});
  car.addEventListener("scroll",()=>{const k=Math.min(hv-1,Math.round(car.scrollLeft/step()));if(k!==cur){cur=k;dots.forEach((d,i)=>d.classList.toggle("on",i===k));$("#ytl").href="https://www.youtube.com/watch?v="+t.videos[k].id;stopAll();gc("tracks-swipe-"+t.id,"Track guide: swiped onboards "+t.name)}},{passive:true});
  dots.forEach(d=>d.onclick=()=>car.scrollTo({left:+d.dataset.dot*step(),behavior:"smooth"}));
  car.addEventListener("click",e=>{const b=e.target.closest("[data-play]");if(!b)return;const k=+b.dataset.play,v=t.videos[k];stopAll();const nb=car.querySelector(`[data-play="${k}"]`);nb.outerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(v.id)}?autoplay=1&playsinline=1&rel=0&modestbranding=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="${esc(v.title)}"></iframe>`;gc("tracks-play-"+t.id+"-"+v.id,"Track guide: play "+t.name+" / "+v.title)});}
  $$("[data-ev]").forEach(a=>a.addEventListener("click",()=>gc("tracks-"+a.dataset.ev+"-"+t.id,"Track guide: "+a.dataset.ev+" "+t.name)));
  gc("tracks-view-"+t.id,"Track guide: "+t.name)}
const $$=s=>[...document.querySelectorAll(s)];
function route(){const id=location.hash.slice(1),t=T.find(x=>x.id===id);t?page(t):list();document.getElementById("scroller").scrollTo(0,0)}
addEventListener("hashchange",route);
fetch("../data/tracks.json",{cache:"no-cache"}).then(r=>r.json()).then(d=>{T=d;route()}).catch(()=>{$("#app").innerHTML=`<div class="soon">Couldn't load the track guides. Check your connection and try again.</div>`});
</script>
