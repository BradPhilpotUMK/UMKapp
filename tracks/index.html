function svg(t,cls,big){const g=t.geo;return `<svg class="${cls}" viewBox="-10 -10 ${g.w+20} ${g.h+20}" preserveAspectRatio="xMidYMid meet" aria-label="${esc(t.name)} layout">${big?g.alts.map(a=>`<path class="track-alt" d="${a}"/>`).join(""):""}<path class="track-main ${big?"draw":""}" d="${g.main}" style="--acc:${t.accent}${big?"":";stroke-width:26"}"/>${big?`<path class="track-core draw" d="${g.main}"/>`:`<path d="${g.main}" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round" opacity=".85"/>`}</svg>`}
function list(){document.documentElement.style.setProperty("--acc","#FF0074");$("#h1").textContent="Track Guides";$("#backT").textContent="Home";$("#back").href="../";document.title="Use More Kerb Track Guides";

  <div class="grid">${T.map(t=>`<a class="tc" href="#${t.id}" style="--a:${t.accent}">${svg(t,"",false)}<span class="t"><small>${esc(t.layout)}</small><b>${esc(t.name)}</b><span>${esc(t.place)} · ${esc(t.len)}</span></span><i>›</i></a>`).join("")}</div>
  <div class="soon">More tracks on the way: Whilton Mill, PFi, Shenington, Rowrah and more.</div>`;}
function page(t){const i=T.indexOf(t),prev=T[(i+T.length-1)%T.length],next=T[(i+1)%T.length];

  const stopAll=()=>car.querySelectorAll("iframe").forEach(f=>{const k=+f.closest(".sl").dataset.k,v=t.videos[k];f.outerHTML=`<button type="button" data-play="${k}" style="background-image:url(https://i.ytimg.com/vi/${esc(v.id)}/maxresdefault.jpg)" aria-label="Play ${esc(v.title)}"><span class="play"></span></button>`});

  car.addEventListener("click",e=>{const b=e.target.closest("[data-play]");if(!b)return;const k=+b.dataset.play,v=t.videos[k];stopAll();const nb=car.querySelector(`[data-play="${k}"]`);nb.outerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(v.id)}?autoplay=1&playsinline=1&rel=0&modestbranding=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="${esc(v.title)}"></iframe>`;gc("tracks-play-"+t.id+"-"+v.id,"Track guide: play "+t.name+" / "+v.title)});
