name: Probe live timing pages (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for s in formulafast buckmore teamkarting wmkc knockhill rye; do
            echo "=== $s"; curl -sL -A "Mozilla/5.0" "https://www.alpharacehub.com/$s/live" -o p.html; wc -c p.html
            grep -o -i 'no active session[^<]\{0,40\}' p.html | head -2
            grep -o '<script[^>]*src="[^"]*"' p.html | head -8
            grep -o -i '"[^"]*\(signalr\|socket\|hub\|api\)[^"]*"' p.html | sort -u | head -15
            sed 's/<[^>]*>/ /g' p.html | tr -s ' \n' | head -c 600; echo
          done
